<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" />
    <title>ICN Flight Alert — Offline</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 28rem;
        width: 100%;
        border-radius: 1rem;
        border: 1px solid rgba(148, 163, 184, 0.25);
        background: rgba(30, 41, 59, 0.85);
        padding: 1.75rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.25rem;
        font-weight: 700;
      }
      p {
        margin: 0.75rem 0 0;
        font-size: 0.875rem;
        line-height: 1.55;
        color: #94a3b8;
      }
      .divider {
        margin: 1.25rem 0;
        height: 1px;
        background: rgba(148, 163, 184, 0.2);
      }
      .en {
        font-size: 0.8125rem;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>연결할 수 없습니다</h1>
      <p>네트워크 연결을 확인한 뒤 다시 시도해 주세요. 인천공항 비행 알림은 온라인일 때 최신 정보를 불러옵니다.</p>
      <div class="divider"></div>
      <h1 class="en" style="margin: 0">You’re offline</h1>
      <p class="en">
        Check your connection and try again. Flight alerts need the internet to load the latest data from Incheon
        Airport.
      </p>
    </div>
  </body>
</html>
